# Configuração do Streamlit: identidade visual inspirada no verde do Spotify.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.5rem"     # espaço abaixo da barra do topo (valor entre aspas)
font = "sans serif"       # "sans serif", "serif" ou "monospace"

[theme.light]
primaryColor = "#1a9c48"            # cor de destaque (widgets, links)
backgroundColor = "#ffffff"         # fundo da página
secondaryBackgroundColor = "#eef5f0"  # fundo da sidebar e de widgets
textColor = "#191414"               # cor do texto
borderColor = "#cfdcd3"

[theme.dark]
primaryColor = "#1ed760"
backgroundColor = "#121212"
secondaryBackgroundColor = "#1f2a23"
textColor = "#f5f5f5"
borderColor = "#34433a"
